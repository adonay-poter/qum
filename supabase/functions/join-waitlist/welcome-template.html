<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Reset for email clients */
    body, html {
      margin: 0;
      padding: 0;
      background-color: #0E0D0A;
      width: 100%;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    
    /* Global Typography with robust monospace fallbacks */
    body, table, td, a, p, h2, span {
      font-family: 'IBM Plex Mono', Consolas, Monaco, 'Andale Mono', 'Ubuntu Mono', monospace;
      color: #E8E4DB;
    }

    /* Button hover state (only works in some clients, but good to have) */
    .btn-primary:hover {
      opacity: 0.9 !important;
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0E0D0A; width: 100%;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #0E0D0A; padding: 40px 20px;">
    <tr>
      <td align="center">
        
        <table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width: 420px; background-color: #161410; border-radius: 4px; border: 1px solid #857F72; text-align: left;">
          <tr>
            <td style="padding: 24px;">
              
              <span style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #857F72; display: block; margin-bottom: 16px;">
                Waitlist Signup
              </span>

              <h2 style="font-size: 24px; font-weight: 600; margin: 0 0 16px 0; color: #E8E4DB;">
                You're on the list!
              </h2>

              <p style="font-size: 15px; line-height: 1.55; margin: 0 0 32px 0; color: #E8E4DB;">
                Thanks for your interest in QUM. We've successfully added you to our waitlist. You will receive an exclusive slot the moment beta access opens up.
              </p>


            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
